# ══════════════════════════════════════════════════════════════════════════════
#  Finance Dashboard — CI/CD
#
#  Full documentation: CI-CD.md. The short version:
#
#  * Every job is self-contained. None of them `needs:` another (the single
#    exception is `release`, which by definition cannot run before the things it
#    publishes exist, and must not run when a blocking job failed). A job that
#    fails can be re-run on its own from the GitHub UI without dragging five
#    other jobs along, and a broken linter never blocks a build. Each job checks
#    out, sets up Qt and reads the version itself.
#
#  * Gitflow. CI runs on pull requests and on pushes to main, develop,
#    release/** and hotfix/**. main only receives merges of release/* and
#    hotfix/* branches, whose version is already dated (`version.py release`).
#    A push to main publishes that version: tag vX.Y.Z and a GitHub release,
#    with no commit to main. Then CI opens a pull request into develop that
#    merges main back and opens the next patch version.
#
#  * The end products are meant to be plug and play. A user downloads one file:
#      Windows  FinanceDashboard-<v>-windows-x64.exe   setup, shortcuts,
#                                                      uninstaller, Qt included
#      Linux    FinanceDashboard-<v>-linux-x86_64.AppImage   chmod +x, run
#      plus portable archives, a .deb, and the source, all with SHA-256 sums.
#    Nobody has to install Qt, download a DLL or read a build instruction.
# ══════════════════════════════════════════════════════════════════════════════
name: CI

on:
  # feature/* and bugfix/* branches run through their pull request, so a push
  # to them does not start a second run.
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
  workflow_dispatch:

# Read-only by default; the release job asks for more for itself.
permissions:
  contents: read

concurrency:
  # One run per branch or pull request: a new push cancels the older run.
  # On main, no run may be cancelled, because each merge into main is a
  # release. A shared group is not enough for that: GitHub cancels a run that
  # waits in a group when a newer one joins it, even when cancel-in-progress
  # is false. So each main commit has a group of its own, and the release job
  # queues the publishing itself (its own `concurrency`, below).
  group: ci-${{ github.ref_name == 'main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  # The one place the Qt version is written. Bump it here and every job follows.
  #
  # Pinned to 6.10.3 rather than 6.11.x on purpose. Qt changed the Windows
  # repository layout at 6.11.0 — the packages moved from
  #   windows_x86/desktop/qt6_<ver>/qt6_<ver>/
  # to a per-compiler folder
  #   windows_x86/desktop/qt6_<ver>/qt6_<ver>_msvc2022_64/
  # and aqtinstall 3.3.0 (the newest release) still asks for the old path, so
  # the Windows job dies with "Failed to locate XML data for Qt version". Linux
  # kept the old layout, which is why only Windows broke.
  # Fixed upstream in aqtinstall PR #1000, unreleased as of 2026-09-14:
  #   https://github.com/miurahr/aqtinstall/issues/959
  # When aqtinstall > 3.3.0 ships, this is a one-word change back to 6.11.x —
  # nothing else in the pipeline or the project cares (the app needs Qt 6.8+).
  QT_VERSION: 6.10.3
  # qtgraphs is what the app uses; qtquick3d and qtshadertools are what qtgraphs
  # needs. Qt's binary Graphs module is built with both the 2D and the 3D feature
  # on and lists Qt::Quick3D as a *public* link dependency, so Qt6GraphsConfig
  # calls find_dependency(Qt6Quick3D) — install qtgraphs alone and CMake reports
  # 'Failed to find required Qt component "Graphs"' even though Qt6GraphsConfig
  # is sitting right there. Quick3D in turn pulls in ShaderTools.
  # Source: qtgraphs/src/CMakeLists.txt, PUBLIC_LIBRARIES of the Graphs module.
  QT_MODULES: qtgraphs qtquick3d qtshadertools

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  #  Quality gates — no packaging, fast feedback, all four run in parallel
  # ────────────────────────────────────────────────────────────────────────────

  # Cheapest job in the pipeline and the one that protects the release flow: if
  # version.md and version.json disagree, if more than one version is in
  # progress, or if a branch changes a version that is already released on
  # main, the changelog and the release notes would ship wrong — and since the
  # version number is what names every artifact and every tag, wrong here means
  # wrong everywhere.
  #
  # tools/generate_docs.py --check is deliberately NOT run: it regenerates
  # docs/generated/source-tree.md, and docs/ was removed from this project (see
  # version.md v0.2.1 § Changed). Add it back here the day docs/ comes back.
  changelog:
    name: Changelog & version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # main is the base: the versions that are released (dated) there cannot
      # change on any other branch.
      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin main

      - name: version.json ↔ version.md are in sync, released versions unchanged
        run: python tools/version.py check --base FETCH_HEAD

      - name: Preview the release notes this version would publish
        run: |
          {
            echo "### Next release: v$(python tools/version.py current)"
            echo ""
            python tools/version.py notes
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests (ctest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-qt
        with:
          qt-version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DFD_BUILD_TESTS=ON

      - name: Build test targets
        # fd_tests (tests/CMakeLists.txt) depends on every test target.
        run: cmake --build build --target fd_tests --parallel

      - name: Run ctest
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

  qmllint:
    name: qmllint
    runs-on: ubuntu-24.04
    # Not blocking (yet). qmllint has never run over this codebase in CI, so the
    # first runs are a report, not a gate — a warning in a QML file must not stop
    # a release going out. Flip this to `false` once the QML tree is clean; see
    # CI-CD.md § Turning the linters into gates.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-qt
        with:
          qt-version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      # qt_add_qml_module() generates this target for us — same one
      # tools/run-static-analysis.ps1 invokes locally, so CI and the dev
      # machine are checking exactly the same thing.
      - name: Run qmllint
        run: cmake --build build --target FinanceDashboard_qmllint 2>&1 | tee qmllint.log

      - name: Upload qmllint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qmllint-log
          path: qmllint.log
          if-no-files-found: ignore

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    # Same reasoning as qmllint: the project's .clang-tidy is deliberately
    # aggressive and has never been enforced, so this reports rather than gates.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-qt
        with:
          qt-version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Install clang-tidy
        run: sudo apt-get install -y --no-install-recommends clang-tidy clang-tools

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # AUTOMOC output and the generated QML type-registration sources have to
      # exist before clang-tidy can parse anything that includes them.
      - name: Build (generates moc / qml registration sources)
        run: cmake --build build --parallel

      # Only this project's own translation units — the file-name regex keeps
      # everything CMake and Qt generated inside build/ out of the report, which
      # is what the build-dir .clang-tidy trick in CMakeLists.txt does for the
      # in-build variant of this check.
      - name: Run clang-tidy over src/
        run: |
          # Ubuntu ships the driver as run-clang-tidy or run-clang-tidy-<major>
          # depending on the release; resolve it instead of guessing.
          runner=$(command -v run-clang-tidy || ls /usr/bin/run-clang-tidy-* 2>/dev/null | head -1)
          test -n "$runner" || { echo "::error::run-clang-tidy not found"; exit 1; }
          "$runner" -p build -quiet "$(pwd)/src/.*\.cpp" 2>&1 | tee clang-tidy.log || true
          # grep -c prints the count (also "0") and exits 1 when nothing
          # matches, so ignore its exit code; "|| echo 0" would print a second 0.
          warnings=$(grep -c "warning:" clang-tidy.log || true)
          errors=$(grep -c "error:" clang-tidy.log || true)
          {
            echo "### clang-tidy"
            echo ""
            echo "| | count |"
            echo "|---|---|"
            echo "| warnings | ${warnings} |"
            echo "| errors | ${errors} |"
            echo ""
            echo "Full log: the \`clang-tidy-log\` artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"
          # Errors mean clang-tidy could not parse the code — that is a real
          # break, unlike a style warning, so fail the (non-blocking) job on it.
          test "$errors" -eq 0

      - name: Upload clang-tidy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: clang-tidy.log
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  #  Packaging — one job per platform, each producing finished, signed-off files
  # ────────────────────────────────────────────────────────────────────────────

  package-windows:
    name: Package — Windows (setup + portable)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python tools/version.py current)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-qt
        with:
          qt-version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      # The windows-2025 image ships Inno Setup, and CPack finds ISCC on PATH or
      # in its default folder. Image updates can change its version, so write
      # the version that builds this setup to the log.
      - name: Inno Setup version
        shell: pwsh
        run: |
          # The install folder first: on PATH there is only a Chocolatey shim,
          # whose file version is not the version of Inno Setup.
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw "ISCC.exe not found in Program Files (x86)\Inno Setup 6 or on PATH" }
          Write-Host "Inno Setup $((Get-Item $iscc).VersionInfo.ProductVersion) — $iscc"

      # No -G: let CMake pick the runner's Visual Studio generator rather than
      # naming a version that changes with the runner image.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # The self-contained tree everything else is cut from: the .exe, every Qt
      # DLL it actually uses, the plugins, the QML modules and a qt.conf.
      - name: Install (self-contained tree)
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"

      # Does the thing actually start? A missing QML module or platform plugin
      # only shows up at runtime, and shipping an installer that opens to a
      # blank screen is exactly the failure this pipeline exists to prevent.
      # main.cpp exits -1 on objectCreationFailed, so "still alive after 15s"
      # means the whole QML tree loaded.
      #
      # The test uses the real "windows" platform plugin, the one users get.
      # The deploy step ships only that plugin, so the "offscreen" plugin is not
      # in the tree (the Linux tree has only "xcb" for the same reason).
      - name: Smoke test the deployed app
        shell: pwsh
        run: |
          # Hide the CI machine's own Qt from the test. install-qt-action puts
          # Qt on PATH and sets QT_PLUGIN_PATH/QML2_IMPORT_PATH; leaving those in
          # place would let the app borrow a DLL or a QML module the installer
          # forgot to ship, and the test would pass on a broken package.
          $env:QT_PLUGIN_PATH = ""
          $env:QML2_IMPORT_PATH = ""
          $env:QML_IMPORT_PATH = ""
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch '(?i)\\Qt\\' }) -join ';'
          $stage = "${{ github.workspace }}\stage"
          Write-Host "Platform plugins in the deployed tree:"
          Get-ChildItem -Path $stage -Recurse -Filter "q*.dll" |
            Where-Object { $_.Directory.Name -eq "platforms" } |
            ForEach-Object { Write-Host "  $($_.FullName.Substring($stage.Length + 1))" }
          $exe = "$stage\FinanceDashboard.exe"
          if (-not (Test-Path $exe)) { throw "not found: $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            throw "FinanceDashboard.exe exited early with code $($p.ExitCode) — the deployed tree is incomplete"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK — app stayed up for 15s on the windows platform plugin"

      - name: Package (setup + portable ZIP)
        working-directory: build
        run: cpack -C Release -B "${{ github.workspace }}/dist"

      - name: List artifacts
        shell: bash
        run: ls -la dist/*.exe dist/*.zip

      # Install, install again over it (what an update does), then uninstall,
      # in both install modes. Silent mode; /CURRENTUSER and /ALLUSERS choose
      # the mode that the dialog asks for in an interactive setup.
      - name: Test the setup (install, update in place, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "${{ github.workspace }}\dist\*.exe" | Select-Object -First 1).FullName
          $appId = "9F2B4E7C-3A61-4C0D-9E8B-5D7A1C46F0B3_is1"
          $key = "Software\Microsoft\Windows\CurrentVersion\Uninstall\$appId"
          $modes = @(
            @{ Name = "for me only";   Flag = "/CURRENTUSER"; Dir = "$env:LOCALAPPDATA\Programs\FinanceDashboard"; Hive = "HKCU" },
            @{ Name = "for all users"; Flag = "/ALLUSERS";    Dir = "$env:ProgramFiles\FinanceDashboard";           Hive = "HKLM" }
          )
          foreach ($m in $modes) {
            foreach ($pass in 1, 2) {
              $log = "${{ github.workspace }}\dist\setup-$($m.Hive)-$pass.log"
              $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
                "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", $m.Flag, "/LOG=`"$log`"")
              if ($p.ExitCode -ne 0) { throw "$($m.Name), pass ${pass}: setup exit code $($p.ExitCode)" }
              if (-not (Test-Path "$($m.Dir)\FinanceDashboard.exe")) { throw "$($m.Name), pass ${pass}: FinanceDashboard.exe is not in $($m.Dir)" }
              if (-not (Test-Path "$($m.Hive):\$key")) { throw "$($m.Name), pass ${pass}: no uninstall key $($m.Hive)\$key" }
            }
            # An update in place appends to the same uninstall log: no unins001.
            if (Test-Path "$($m.Dir)\unins001.exe") { throw "$($m.Name): the second setup made a second uninstaller" }
            $p = Start-Process -FilePath "$($m.Dir)\unins000.exe" -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
            if ($p.ExitCode -ne 0) { throw "$($m.Name): uninstaller exit code $($p.ExitCode)" }
            # The uninstaller continues in a copy of itself, so wait for the files to go.
            for ($i = 0; $i -lt 60 -and (Test-Path "$($m.Dir)\FinanceDashboard.exe"); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path "$($m.Dir)\FinanceDashboard.exe") { throw "$($m.Name): FinanceDashboard.exe is still there after the uninstall" }
            if (Test-Path "$($m.Hive):\$key") { throw "$($m.Name): the uninstall key is still there" }
            Write-Host "OK — $($m.Name): install, update in place and uninstall"
          }

      - name: Upload the setup logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-logs-windows
          path: dist/setup-*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  package-linux:
    name: Package — Linux (AppImage + .deb + portable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(python3 tools/version.py current)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-qt
        with:
          qt-version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Install (self-contained tree)
        run: cmake --install build --prefix "${{ github.workspace }}/stage"

      - name: Package (portable tar.gz)
        working-directory: build
        run: cpack -B "${{ github.workspace }}/dist"

      - name: Package (AppImage)
        run: bash packaging/linux/make-appimage.sh stage "${{ steps.version.outputs.version }}" dist

      - name: Package (.deb)
        run: bash packaging/linux/make-deb.sh stage "${{ steps.version.outputs.version }}" dist

      # Runs the real xcb platform plugin under Xvfb — the same path a user on a
      # desktop gets, not the offscreen shortcut — and runs the AppImage rather
      # than the build tree, so a library the bundler forgot is caught here.
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # GitHub runners have no FUSE
          # Same reasoning as the Windows smoke test: blank out the builder's own
          # Qt so the AppImage can only use what it carries.
          QT_PLUGIN_PATH: ""
          QML2_IMPORT_PATH: ""
          QML_IMPORT_PATH: ""
          LD_LIBRARY_PATH: ""
        run: |
          appimage=$(ls dist/*.AppImage)
          echo "Running $appimage"
          set +e
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            timeout --signal=TERM 20 "$appimage"
          rc=$?
          set -e
          # 124/143 = still running when the timeout fired, which is the pass.
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then
            echo "::error::AppImage exited early with code $rc — the bundle is incomplete"
            exit 1
          fi
          echo "OK — AppImage stayed up for 20s under Xvfb"

      - name: Verify the .deb
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb --contents "$deb" | head -20
          sudo apt-get install -y "./$deb"
          test -x /opt/FinanceDashboard/bin/FinanceDashboard
          test -L /usr/bin/finance-dashboard
          sudo apt-get remove -y finance-dashboard

      - name: List artifacts
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  source-archive:
    name: Package — source
    runs-on: ubuntu-24.04
    steps:
      # Full history so `git archive` sees a real tree, and so the archive
      # matches what a `git clone` at this commit would give.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(python3 tools/version.py current)" >> "$GITHUB_OUTPUT"

      # git archive, not `tar` over the working tree: it respects .gitignore and
      # .gitattributes by construction, so no build directory, no logs/ and no
      # IDE state can ever leak into a published source archive.
      - name: Create source archives
        run: |
          version="${{ steps.version.outputs.version }}"
          prefix="FinanceDashboard-${version}/"
          mkdir -p dist
          git archive --format=tar.gz -9 --prefix="$prefix" \
            -o "dist/FinanceDashboard-${version}-source.tar.gz" HEAD
          git archive --format=zip -9 --prefix="$prefix" \
            -o "dist/FinanceDashboard-${version}-source.zip" HEAD
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: packages-source
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  #  Release — the only job with dependencies, and only on main
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Release
    # Every blocking job: a red Tests or Changelog job stops the release too.
    needs: [changelog, tests, package-windows, package-linux, source-archive]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Releases publish one at a time, first in, first out. `queue: max` keeps
    # every waiting release job; with the default queue, a third one would
    # cancel the one that waits.
    concurrency:
      group: release
      queue: max
    permissions:
      contents: write        # create the tag and the release, push the back-merge branch
      pull-requests: write   # open the back-merge pull request into develop
      actions: write         # start CI on the back-merge branch (workflow_dispatch)
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the token so the back-merge branch can be pushed.
          persist-credentials: true
          # The full history: the back-merge step checks whether develop
          # already contains this commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          version=$(python tools/version.py current)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # main only receives release/* and hotfix/* merges, and those branches
      # stamp the date with `version.py release`. An undated version here means
      # that something else was merged into main.
      - name: The version is dated
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("version.json", encoding="utf-8"))
          release = next(r for r in data["releases"] if r["version"] == data["current"])
          if not release.get("date"):
              print(f"::error::v{data['current']} has no date. main only receives merges of "
                    f"release/* and hotfix/* branches, which run `python tools/version.py release` "
                    f"first. See CI-CD.md § The release flow.")
              sys.exit(1)
          print(f"v{data['current']} — {release['date']}")
          PY

      # A re-run finishes what an earlier run started. A published release is
      # not published again, but the back-merge below still runs. A draft (a
      # run that stopped while gh uploaded the packages) is deleted and
      # published again.
      - name: Find an existing release
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          published=false
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "true" ]; then
              echo "::warning::$tag is a draft from an earlier run. It is deleted and published again."
              gh release delete "$tag" --yes
            else
              echo "::notice::$tag is already published. Only the back-merge runs."
              published=true
            fi
          fi
          # gh release create uses an existing tag as it is: stop if the tag
          # is on another commit.
          tagged=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" \
                   | awk '/\^\{\}$/ {peeled = $1} !/\^\{\}$/ {plain = $1} END {print (peeled != "" ? peeled : plain)}')
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag is on $tagged, not on this commit ($GITHUB_SHA)."
            exit 1
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Download every package
        if: steps.guard.outputs.published == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Checksums
        if: steps.guard.outputs.published == 'false'
        working-directory: dist
        run: |
          # Written outside the directory first, so the sums file can never end
          # up listing (a partially written copy of) itself.
          find . -maxdepth 1 -type f -printf '%f\0' | sort -z \
            | xargs -0 sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      # The changelog for this version comes from version.json; the "how do I
      # install this" half is the same every time and lives in a file so it can
      # be edited without touching the workflow.
      - name: Build release notes
        if: steps.guard.outputs.published == 'false'
        run: |
          {
            python tools/version.py notes --version "${{ steps.version.outputs.version }}"
            echo
            cat .github/release-notes-footer.md
          } > release-notes.md
          cat release-notes.md

      # `gh release create --target` also creates the tag vX.Y.Z on this commit.
      - name: Publish the GitHub release
        id: publish
        if: steps.guard.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Finance Dashboard ${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            dist/*

      # ── Back into develop ────────────────────────────────────────────────────
      # A branch from this commit opens the next patch version, and a pull
      # request merges it into develop: develop gets the dated release and the
      # new in-progress version in one merge. Nothing is committed to main.
      #
      # Each part is skipped when it is already done, so a re-run can finish a
      # back-merge that failed. GitHub refuses the pull request when the
      # repository does not allow GitHub Actions to create pull requests
      # (Settings → Actions → General → Workflow permissions): the job then
      # fails, and a re-run after the setting is changed opens it.
      - name: Open the back-merge pull request into develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          branch="chore/back-merge-v${version}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin develop
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "develop already contains $GITHUB_SHA: the back-merge is done."
            echo "backmerge=done" >> "$GITHUB_ENV"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch exists: an earlier run pushed it."
            git fetch --no-tags origin "$branch"
            next=$(git show FETCH_HEAD:version.json | python -c 'import json, sys; print(json.load(sys.stdin)["current"])')
          else
            git checkout -b "$branch" "$GITHUB_SHA"
            next=$(python tools/version.py bump patch)
            python tools/version.py check
            git add version.json version.md
            git commit -m "chore(release): open v${next} after v${version}"
            git push origin "$branch"
          fi
          echo "next=$next" >> "$GITHUB_ENV"

          if [ -z "$(gh pr list --head "$branch" --base develop --state open --json number --jq '.[].number')" ]; then
            if ! gh pr create --base develop --head "$branch" \
                --title "chore(release): merge v${version} back into develop and open v${next}" \
                --body "Merges \`main\` (release v${version}) back into \`develop\` and opens v${next} as the in-progress version. Opened by the release job. Merge it with a merge commit, not a squash. See CI-CD.md § The release flow."; then
              echo "::error::Could not open the pull request from ${branch} into develop. Allow GitHub Actions to create pull requests (Settings → Actions → General → Workflow permissions), then re-run this job. It does not publish the release again."
              exit 1
            fi
          fi

          # A pull request opened with GITHUB_TOKEN starts no CI run, so a
          # branch rule that asks for green CI would block it. workflow_dispatch
          # is an event that GITHUB_TOKEN can start: run CI on the branch, and
          # its checks show on the pull request.
          gh workflow run ci.yml --ref "$branch"
          echo "backmerge=opened" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          tag="${{ steps.version.outputs.tag }}"
          {
            echo "### Release"
            if [ "${{ steps.guard.outputs.published }}" = "true" ]; then
              echo "\`$tag\` was already published: not published again."
            elif [ "${{ steps.publish.outcome }}" = "success" ]; then
              echo "Published **$tag**: https://github.com/${{ github.repository }}/releases/tag/$tag"
            else
              echo "**$tag is not published.** See the failed step, then re-run this job."
            fi
            echo ""
            case "${backmerge:-}" in
              opened) echo "Back-merge into develop: pull request open, next version \`v${next}\`. CI runs on its branch." ;;
              done)   echo "Back-merge into develop: already done." ;;
              *)      echo "**Back-merge into develop: not done.** See the failed step, then re-run this job." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
