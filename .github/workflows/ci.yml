# ══════════════════════════════════════════════════════════════════════════════
#  Finance Dashboard — CI/CD
#
#  Full documentation: CI-CD.md. The short version:
#
#  * Every job is self-contained. None of them `needs:` another (the
#    exceptions are `release` and `prerelease`, which by definition cannot run
#    before the things they publish exist, and must not run when a blocking
#    job failed, and `open-next-version`, which waits for the Changelog job). A job that fails
#    can be re-run on its own from the GitHub UI without dragging five other
#    jobs along, and a broken linter never blocks a build. Each job checks out,
#    sets up Qt and reads the version itself.
#
#  * Gitflow. CI runs on pull requests and on pushes to main, develop,
#    release/** and hotfix/**. A push to a release/* branch makes CI open a
#    pull request into develop that opens the next version. main only receives
#    merges of release/* and hotfix/* branches, whose version is dated
#    (`version.py release`) before the merge. A push to main publishes that
#    version: tag vX.Y.Z and a GitHub release, with no commit to main. Then CI
#    opens a pull request that merges main back into develop.
#
#  * Release channels (#129). A push to develop, or a pull request with the
#    label "experimental", publishes an experimental pre-release of the Test
#    app (vX.Y.Z-exp.<run>, vX.Y.Z-exp.<run>.pr<number>); a push to
#    release/** publishes a release candidate (vX.Y.Z-rc.<run>). See the
#    prerelease job and CI-CD.md.
#
#  * The end products are meant to be plug and play. A user downloads one file:
#      Windows  FinanceDashboard-<v>-windows-x64.exe   setup, shortcuts,
#                                                      uninstaller, Qt included
#      Linux    FinanceDashboard-<v>-linux-x86_64.AppImage   chmod +x, run
#      plus portable archives, a .deb, and the source, all with SHA-256 sums.
#    Nobody has to install Qt, download a DLL or read a build instruction.
# ══════════════════════════════════════════════════════════════════════════════
name: CI

on:
  # feature/* and bugfix/* branches run through their pull request, so a push
  # to them does not start a second run.
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  # "labeled" too: the label "experimental" makes a pull request publish a
  # pre-release (#129), so adding it starts a run. Another label also starts
  # one, which cancels the run in progress (see concurrency), but publishes
  # nothing.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Read-only by default; the release job asks for more for itself.
permissions:
  contents: read

concurrency:
  # One run per branch or pull request: a new push cancels the older run.
  # On main, no run may be cancelled, because each merge into main is a
  # release. A shared group is not enough for that: GitHub cancels a run that
  # waits in a group when a newer one joins it, even when cancel-in-progress
  # is false. So each main commit has a group of its own, and the release job
  # queues the publishing itself (its own `concurrency`, below).
  group: ci-${{ github.ref_name == 'main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  # The one place the Qt version is written. Bump it here and every job follows.
  #
  # Pinned to 6.10.3 rather than 6.11.x on purpose. Qt changed the Windows
  # repository layout at 6.11.0 — the packages moved from
  #   windows_x86/desktop/qt6_<ver>/qt6_<ver>/
  # to a per-compiler folder
  #   windows_x86/desktop/qt6_<ver>/qt6_<ver>_msvc2022_64/
  # and aqtinstall 3.3.0 (the newest release) still asks for the old path, so
  # the Windows job dies with "Failed to locate XML data for Qt version". Linux
  # kept the old layout, which is why only Windows broke.
  # Fixed upstream in aqtinstall PR #1000, unreleased as of 2026-09-14:
  #   https://github.com/miurahr/aqtinstall/issues/959
  # When aqtinstall > 3.3.0 ships, this is a one-word change back to 6.11.x —
  # nothing else in the pipeline or the project cares (the app needs Qt 6.10+).
  QT_VERSION: 6.10.3
  # qtgraphs is what the app uses; qtquick3d and qtshadertools are what qtgraphs
  # needs. Qt's binary Graphs module is built with both the 2D and the 3D feature
  # on and lists Qt::Quick3D as a *public* link dependency, so Qt6GraphsConfig
  # calls find_dependency(Qt6Quick3D) — install qtgraphs alone and CMake reports
  # 'Failed to find required Qt component "Graphs"' even though Qt6GraphsConfig
  # is sitting right there. Quick3D in turn pulls in ShaderTools.
  # Source: qtgraphs/src/CMakeLists.txt, PUBLIC_LIBRARIES of the Graphs module.
  QT_MODULES: qtgraphs qtquick3d qtshadertools

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  #  Quality gates — no packaging, fast feedback, all four run in parallel
  # ────────────────────────────────────────────────────────────────────────────

  # Cheapest job in the pipeline and the one that protects the release flow: if
  # version.md and version.json disagree, if more than one version is in
  # progress, or if a branch changes a version that is already released on
  # main, the changelog and the release notes would ship wrong — and since the
  # version number is what names every artifact and every tag, wrong here means
  # wrong everywhere.
  #
  # tools/generate_docs.py --check is deliberately NOT run: it regenerates
  # docs/generated/source-tree.md, and docs/ was removed from this project (see
  # version.md v0.2.1 § Changed). Add it back here the day docs/ comes back.
  changelog:
    name: Changelog & version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests of version.py and release_flow.py
        run: python -m unittest discover -s tools -p "test_*.py" -v

      # main is the base: the versions that are released (dated) there cannot
      # change on any other branch. A pull request has its base branch as a
      # second base: on develop, the version of a release branch can change
      # only in that release branch.
      - name: Fetch main and the base branch
        run: |
          git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main
          if [ -n "$GITHUB_BASE_REF" ] && [ "$GITHUB_BASE_REF" != main ]; then
            git fetch --no-tags --depth=1 origin "+$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          fi

      - name: version.json ↔ version.md are in sync, released versions unchanged
        run: |
          options=(--base origin/main)
          if [ -n "$GITHUB_BASE_REF" ] && [ "$GITHUB_BASE_REF" != main ]; then
            options+=(--base "origin/$GITHUB_BASE_REF")
          fi
          # A pull request into main releases its version: the version must be dated.
          if [ "$GITHUB_BASE_REF" = main ]; then
            options+=(--dated)
          fi
          python tools/version.py check "${options[@]}"

      # From the cut of release/X.Y.Z to the back-merge of its release, the
      # version of develop takes no new change: the release branch releases it
      # without that change. So the pull request that opens the next version
      # (chore/open-v…) goes into develop first, and after the release the
      # back-merge pull request (chore/back-merge-v…) goes first. The version
      # comes from develop, not from the pull request, so that a pull request
      # that renames the version does not pass. The two branches that CI makes
      # are the way out, so they skip the check. A re-run uses the merge commit
      # of the first run: update the branch to run the check again.
      - name: The version of a release branch takes no new change
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'develop' &&
          !startsWith(github.head_ref, 'chore/open-v') &&
          !startsWith(github.head_ref, 'chore/back-merge-v')
        run: |
          current=$(git show origin/develop:version.json | python -c 'import json, sys; print(json.load(sys.stdin)["current"])')
          if git ls-remote --exit-code --heads origin "release/$current" >/dev/null; then
            echo "::error::release/$current is cut, so v$current takes no new change on develop. Merge the pull request that opens the next version on develop (chore/open-v…) first, then update this branch."
            exit 1
          fi
          if git show origin/main:version.json | python -c 'import json, sys; sys.exit(0 if any(r["version"] == sys.argv[1] and r.get("date") for r in json.load(sys.stdin)["releases"]) else 1)' "$current"; then
            echo "::error::v$current is released, and develop does not have the back-merge yet. Merge the back-merge pull request (chore/back-merge-v$current) first, then update this branch."
            exit 1
          fi

      - name: Preview the release notes this version would publish
        run: |
          {
            echo "### Next release: v$(python tools/version.py current)"
            echo ""
            python tools/version.py notes
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests (ctest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-qt
        with:
          qt-version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DFD_BUILD_TESTS=ON

      - name: Build test targets
        # fd_tests (tests/CMakeLists.txt) depends on every test target.
        run: cmake --build build --target fd_tests --parallel

      - name: Run ctest
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

  qmllint:
    name: qmllint
    runs-on: ubuntu-24.04
    # Not blocking (yet). qmllint has never run over this codebase in CI, so the
    # first runs are a report, not a gate — a warning in a QML file must not stop
    # a release going out. Flip this to `false` once the QML tree is clean; see
    # CI-CD.md § Turning the linters into gates.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-qt
        with:
          qt-version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      # qt_add_qml_module() generates this target for us — same one
      # tools/run-static-analysis.ps1 invokes locally, so CI and the dev
      # machine are checking exactly the same thing.
      - name: Run qmllint
        run: cmake --build build --target FinanceDashboard_qmllint 2>&1 | tee qmllint.log

      - name: Upload qmllint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qmllint-log
          path: qmllint.log
          if-no-files-found: ignore

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    # Same reasoning as qmllint: the project's .clang-tidy is deliberately
    # aggressive and has never been enforced, so this reports rather than gates.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-qt
        with:
          qt-version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Install clang-tidy
        run: sudo apt-get install -y --no-install-recommends clang-tidy clang-tools

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # AUTOMOC output and the generated QML type-registration sources have to
      # exist before clang-tidy can parse anything that includes them.
      - name: Build (generates moc / qml registration sources)
        run: cmake --build build --parallel

      # Only this project's own translation units — the file-name regex keeps
      # everything CMake and Qt generated inside build/ out of the report, which
      # is what the build-dir .clang-tidy trick in CMakeLists.txt does for the
      # in-build variant of this check.
      - name: Run clang-tidy over src/
        run: |
          # Ubuntu ships the driver as run-clang-tidy or run-clang-tidy-<major>
          # depending on the release; resolve it instead of guessing.
          runner=$(command -v run-clang-tidy || ls /usr/bin/run-clang-tidy-* 2>/dev/null | head -1)
          test -n "$runner" || { echo "::error::run-clang-tidy not found"; exit 1; }
          "$runner" -p build -quiet "$(pwd)/src/.*\.cpp" 2>&1 | tee clang-tidy.log || true
          # grep -c prints the count (also "0") and exits 1 when nothing
          # matches, so ignore its exit code; "|| echo 0" would print a second 0.
          warnings=$(grep -c "warning:" clang-tidy.log || true)
          errors=$(grep -c "error:" clang-tidy.log || true)
          {
            echo "### clang-tidy"
            echo ""
            echo "| | count |"
            echo "|---|---|"
            echo "| warnings | ${warnings} |"
            echo "| errors | ${errors} |"
            echo ""
            echo "Full log: the \`clang-tidy-log\` artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"
          # Errors mean clang-tidy could not parse the code — that is a real
          # break, unlike a style warning, so fail the (non-blocking) job on it.
          test "$errors" -eq 0

      - name: Upload clang-tidy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: clang-tidy.log
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  #  Packaging — one job per platform, each producing finished, signed-off files
  # ────────────────────────────────────────────────────────────────────────────

  package-windows:
    name: Package — Windows (setup + portable)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python tools/version.py current)" >> "$GITHUB_OUTPUT"

      # The pre-release of this run (#129): the Test packages get its version
      # suffix (-exp.<run>, -exp.<run>.pr<number>, -rc.<run>).
      - name: Channel
        id: channel
        # bash with pipefail: a failure of the command fails the step, not tee.
        shell: bash
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=(--event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --run "$GITHUB_RUN_NUMBER")
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            args+=(--pr "$PR_NUMBER" --labels "$LABELS")
          fi
          python tools/release_flow.py channel "${args[@]}" | tee -a "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-qt
        with:
          qt-version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      # The windows-2025 image ships Inno Setup, and CPack finds ISCC on PATH or
      # in its default folder. Image updates can change its version, so write
      # the version that builds this setup to the log.
      - name: Inno Setup version
        shell: pwsh
        run: |
          # The install folder first: on PATH there is only a Chocolatey shim,
          # whose file version is not the version of Inno Setup.
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw "ISCC.exe not found in Program Files (x86)\Inno Setup 6 or on PATH" }
          Write-Host "Inno Setup $((Get-Item $iscc).VersionInfo.ProductVersion) — $iscc"

      # No -G: let CMake pick the runner's Visual Studio generator rather than
      # naming a version that changes with the runner image.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # The self-contained tree everything else is cut from: the .exe, every Qt
      # DLL it actually uses, the plugins, the QML modules and a qt.conf.
      - name: Install (self-contained tree)
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"

      # The update check (#117) uses HTTPS. On Windows, Qt's Schannel backend
      # uses the TLS of the system: no OpenSSL DLL to ship, but the plugin must
      # be in the tree.
      - name: The deployed tree has the TLS backend
        shell: pwsh
        run: |
          $stage = "${{ github.workspace }}\stage"
          $tls = @(Get-ChildItem -Path $stage -Recurse -Filter "*.dll" | Where-Object { $_.Directory.Name -eq "tls" })
          $tls | ForEach-Object { Write-Host "  $($_.FullName.Substring($stage.Length + 1))" }
          if (-not ($tls | Where-Object { $_.Name -eq "qschannelbackend.dll" })) {
            throw "tls\qschannelbackend.dll is not in the deployed tree: the update check cannot use HTTPS"
          }

      # Does the thing actually start? A missing QML module or platform plugin
      # only shows up at runtime, and shipping an installer that opens to a
      # blank screen is exactly the failure this pipeline exists to prevent.
      # main.cpp exits -1 on objectCreationFailed, so "still alive after 15s"
      # means the whole QML tree loaded.
      #
      # The test uses the real "windows" platform plugin, the one users get.
      # The deploy step ships only that plugin, so the "offscreen" plugin is not
      # in the tree (the Linux tree has only "xcb" for the same reason).
      - name: Smoke test the deployed app
        shell: pwsh
        run: |
          # Hide the CI machine's own Qt from the test. install-qt-action puts
          # Qt on PATH and sets QT_PLUGIN_PATH/QML2_IMPORT_PATH; leaving those in
          # place would let the app borrow a DLL or a QML module the installer
          # forgot to ship, and the test would pass on a broken package.
          $env:QT_PLUGIN_PATH = ""
          $env:QML2_IMPORT_PATH = ""
          $env:QML_IMPORT_PATH = ""
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch '(?i)\\Qt\\' }) -join ';'
          $stage = "${{ github.workspace }}\stage"
          Write-Host "Platform plugins in the deployed tree:"
          Get-ChildItem -Path $stage -Recurse -Filter "q*.dll" |
            Where-Object { $_.Directory.Name -eq "platforms" } |
            ForEach-Object { Write-Host "  $($_.FullName.Substring($stage.Length + 1))" }
          $exe = "$stage\FinanceDashboard.exe"
          if (-not (Test-Path $exe)) { throw "not found: $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            throw "FinanceDashboard.exe exited early with code $($p.ExitCode) — the deployed tree is incomplete"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK — app stayed up for 15s on the windows platform plugin"

      # The icon resource IDI_ICON1 (packaging/windows/app.rc.in, #111):
      # Explorer and the shortcuts show it.
      - name: The .exe has its icon
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class PeResource {
              [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
              public static extern IntPtr LoadLibraryEx(string path, IntPtr file, uint flags);
              [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
              public static extern IntPtr FindResource(IntPtr module, string name, IntPtr type);
          }
          "@
          $exe = "${{ github.workspace }}\stage\FinanceDashboard.exe"
          $module = [PeResource]::LoadLibraryEx($exe, [IntPtr]::Zero, 0x2)   # LOAD_LIBRARY_AS_DATAFILE
          if ($module -eq [IntPtr]::Zero) { throw "cannot load $exe as a data file" }
          $icon = [PeResource]::FindResource($module, "IDI_ICON1", [IntPtr]14)   # RT_GROUP_ICON
          if ($icon -eq [IntPtr]::Zero) { throw "FinanceDashboard.exe has no IDI_ICON1 icon resource" }
          Write-Host "OK — FinanceDashboard.exe has its icon (IDI_ICON1)"

      - name: Package (setup + portable ZIP)
        working-directory: build
        run: cpack -C Release -B "${{ github.workspace }}/dist"

      - name: List artifacts
        shell: bash
        run: ls -la dist/*.exe dist/*.zip

      # Install, install again over it (what an update does), then uninstall,
      # in both install modes. Silent mode; /CURRENTUSER and /ALLUSERS choose
      # the mode that the dialog asks for in an interactive setup.
      - name: Test the setup (install, update in place, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "${{ github.workspace }}\dist\*.exe" | Select-Object -First 1).FullName
          $appId = "9F2B4E7C-3A61-4C0D-9E8B-5D7A1C46F0B3_is1"
          $key = "Software\Microsoft\Windows\CurrentVersion\Uninstall\$appId"
          $modes = @(
            @{ Name = "for me only";   Flag = "/CURRENTUSER"; Dir = "$env:LOCALAPPDATA\Programs\FinanceDashboard"; Hive = "HKCU" },
            @{ Name = "for all users"; Flag = "/ALLUSERS";    Dir = "$env:ProgramFiles\FinanceDashboard";           Hive = "HKLM" }
          )
          foreach ($m in $modes) {
            foreach ($pass in 1, 2) {
              $log = "${{ github.workspace }}\dist\setup-$($m.Hive)-$pass.log"
              $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
                "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", $m.Flag, "/LOG=`"$log`"")
              if ($p.ExitCode -ne 0) { throw "$($m.Name), pass ${pass}: setup exit code $($p.ExitCode)" }
              if (-not (Test-Path "$($m.Dir)\FinanceDashboard.exe")) { throw "$($m.Name), pass ${pass}: FinanceDashboard.exe is not in $($m.Dir)" }
              if (-not (Test-Path "$($m.Hive):\$key")) { throw "$($m.Name), pass ${pass}: no uninstall key $($m.Hive)\$key" }
            }
            # An update in place appends to the same uninstall log: no unins001.
            if (Test-Path "$($m.Dir)\unins001.exe") { throw "$($m.Name): the second setup made a second uninstaller" }
            $p = Start-Process -FilePath "$($m.Dir)\unins000.exe" -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
            if ($p.ExitCode -ne 0) { throw "$($m.Name): uninstaller exit code $($p.ExitCode)" }
            # The uninstaller continues in a copy of itself, so wait for the files to go.
            for ($i = 0; $i -lt 60 -and (Test-Path "$($m.Dir)\FinanceDashboard.exe"); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path "$($m.Dir)\FinanceDashboard.exe") { throw "$($m.Name): FinanceDashboard.exe is still there after the uninstall" }
            if (Test-Path "$($m.Hive):\$key") { throw "$($m.Name): the uninstall key is still there" }
            Write-Host "OK — $($m.Name): install, update in place and uninstall"
          }

      # The update from the app (#117): the app runs the setup of the new
      # version with the arguments of UpdateInstaller::setupArguments() (the
      # same list here). With the app running, the setup must close it
      # (Restart Manager), install, and start it again (packaging/windows/
      # update-restart.iss); a silent setup without /RESTARTAPP=1 must not
      # start it. In both install modes: "for all users" reuses the mode of
      # the installed copy and runs elevated (the runner is an administrator,
      # so there is no prompt), and the app starts again as the user.
      - name: Test the update from the app (close, install, start again)
        shell: pwsh
        run: |
          # As in the smoke test: the app uses only what it carries.
          $env:QT_PLUGIN_PATH = ""
          $env:QML2_IMPORT_PATH = ""
          $env:QML_IMPORT_PATH = ""
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch '(?i)\\Qt\\' }) -join ';'
          $setup = (Get-ChildItem "${{ github.workspace }}\dist\FinanceDashboard-*.exe" | Select-Object -First 1).FullName
          $modes = @(
            @{ Name = "for me only";   Flag = "/CURRENTUSER"; Dir = "$env:LOCALAPPDATA\Programs\FinanceDashboard"; Tag = "user" },
            @{ Name = "for all users"; Flag = "/ALLUSERS";    Dir = "$env:ProgramFiles\FinanceDashboard";           Tag = "all" }
          )
          foreach ($m in $modes) {
            $dir = $m.Dir
            $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", $m.Flag,
              "/LOG=`"${{ github.workspace }}\dist\setup-update-$($m.Tag)-install.log`"")
            if ($p.ExitCode -ne 0) { throw "$($m.Name), install: setup exit code $($p.ExitCode)" }
            $app = Start-Process -FilePath "$dir\FinanceDashboard.exe" -PassThru
            $null = $app.Handle # else ExitCode stays empty without -Wait
            Start-Sleep -Seconds 10
            if ($app.HasExited) { throw "$($m.Name): the installed app exited early with code $($app.ExitCode)" }
            $log = "${{ github.workspace }}\dist\setup-update-$($m.Tag).log"
            $s = Start-Process -FilePath $setup -PassThru -ArgumentList @(
              "/SILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CLOSEAPPLICATIONS", "/NORESTARTAPPLICATIONS",
              "/RESTARTAPP=1", "/LOG=`"$log`"")
            $null = $s.Handle
            if (-not $s.WaitForExit(300000)) { throw "$($m.Name): the setup did not end in 5 minutes" }
            if ($s.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "$($m.Name), update: setup exit code $($s.ExitCode)" }
            if (-not $app.HasExited) { throw "$($m.Name): the setup did not close the running app" }
            # The [Run] entry starts the new version without waiting: find it.
            $new = $null
            for ($i = 0; $i -lt 30 -and -not $new; $i++) {
              Start-Sleep -Seconds 1
              $new = Get-Process -Name FinanceDashboard -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -eq "$dir\FinanceDashboard.exe" -and $_.Id -ne $app.Id } | Select-Object -First 1
            }
            if (-not $new) { Get-Content $log -Tail 40; throw "$($m.Name): the setup did not start the app again" }
            Start-Sleep -Seconds 5
            if ($new.HasExited) { throw "$($m.Name): the restarted app exited early" }
            Stop-Process -Id $new.Id -Force
            Start-Sleep -Seconds 2
            $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
            if ($p.ExitCode -ne 0) { throw "$($m.Name), silent setup: exit code $($p.ExitCode)" }
            Start-Sleep -Seconds 5
            if (Get-Process -Name FinanceDashboard -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$dir\FinanceDashboard.exe" }) {
              throw "$($m.Name): a silent setup without /RESTARTAPP=1 started the app"
            }
            $p = Start-Process -FilePath "$dir\unins000.exe" -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
            if ($p.ExitCode -ne 0) { throw "$($m.Name): uninstaller exit code $($p.ExitCode)" }
            for ($i = 0; $i -lt 60 -and (Test-Path "$dir\FinanceDashboard.exe"); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path "$dir\FinanceDashboard.exe") { throw "$($m.Name): FinanceDashboard.exe is still there after the uninstall" }
            Write-Host "OK — $($m.Name): the setup closed the running app, updated it and started it again"
          }

      # The Test app (#130): the same build directory, with the Test identity
      # (CMakeLists.txt § App identity). Only main.cpp, the icon resources and
      # the QML caches build again.
      - name: Build the Test app (setup + portable)
        shell: bash
        run: |
          cmake -B build -DFD_APP_IDENTITY=test -DFD_VERSION_SUFFIX="${{ steps.channel.outputs.suffix }}"
          cmake --build build --config Release --parallel
          cmake --install build --config Release --prefix "${{ github.workspace }}/stage-test"
          (cd build && cpack -C Release -B "${{ github.workspace }}/dist-test")
          ls -la dist-test/*.exe dist-test/*.zip

      # Both setups for the current user: each app has its own folder, Start
      # menu folder and uninstall entry, and the uninstall of the Test app
      # leaves the prod app in place.
      - name: Test the prod and Test setups side by side
        shell: pwsh
        run: |
          $uninstall = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
          $apps = @(
            @{ Name = "prod"; Setup = (Get-ChildItem "${{ github.workspace }}\dist\FinanceDashboard-*.exe").FullName;
               Dir = "$env:LOCALAPPDATA\Programs\FinanceDashboard"; Menu = "$menu\Finance Dashboard";
               Key = "$uninstall\9F2B4E7C-3A61-4C0D-9E8B-5D7A1C46F0B3_is1" },
            @{ Name = "Test"; Setup = (Get-ChildItem "${{ github.workspace }}\dist-test\FinanceDashboardTest-*.exe").FullName;
               Dir = "$env:LOCALAPPDATA\Programs\FinanceDashboardTest"; Menu = "$menu\Finance Dashboard Test";
               Key = "$uninstall\30296817-401F-4AB5-8B40-42BF8DC81C7F_is1" }
          )
          foreach ($a in $apps) {
            $log = "${{ github.workspace }}\dist\setup-side-by-side-$($a.Name).log"
            $p = Start-Process -FilePath $a.Setup -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/LOG=`"$log`"")
            if ($p.ExitCode -ne 0) { throw "$($a.Name): setup exit code $($p.ExitCode)" }
          }
          foreach ($a in $apps) {
            if (-not (Test-Path "$($a.Dir)\FinanceDashboard.exe")) { throw "$($a.Name): FinanceDashboard.exe is not in $($a.Dir)" }
            if (-not (Test-Path $a.Key)) { throw "$($a.Name): no uninstall key $($a.Key)" }
            if (-not (Get-ChildItem "$($a.Menu)\*.lnk" -ErrorAction SilentlyContinue)) { throw "$($a.Name): no shortcut in $($a.Menu)" }
          }
          $test = $apps[1]
          $p = Start-Process -FilePath "$($test.Dir)\unins000.exe" -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          if ($p.ExitCode -ne 0) { throw "Test: uninstaller exit code $($p.ExitCode)" }
          for ($i = 0; $i -lt 60 -and (Test-Path "$($test.Dir)\FinanceDashboard.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$($test.Dir)\FinanceDashboard.exe") { throw "Test: FinanceDashboard.exe is still there after its uninstall" }
          if (Test-Path $test.Key) { throw "Test: the uninstall key is still there" }
          $prod = $apps[0]
          if (-not (Test-Path "$($prod.Dir)\FinanceDashboard.exe")) { throw "the uninstall of the Test app removed the prod app" }
          if (-not (Test-Path $prod.Key)) { throw "the uninstall of the Test app removed the uninstall key of the prod app" }
          $p = Start-Process -FilePath "$($prod.Dir)\unins000.exe" -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          if ($p.ExitCode -ne 0) { throw "prod: uninstaller exit code $($p.ExitCode)" }
          Write-Host "OK — the prod and Test apps install side by side, and each one uninstalls alone"

      - name: Upload the setup logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-logs-windows
          path: dist/setup-*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

      # Not "packages-*": the release job publishes those (the prod app only).
      # The pre-releases of the Test app use these (#129).
      - uses: actions/upload-artifact@v4
        with:
          name: test-packages-windows
          path: |
            dist-test/*.exe
            dist-test/*.zip
          if-no-files-found: error
          retention-days: 30

  package-linux:
    name: Package — Linux (AppImage + .deb + portable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(python3 tools/version.py current)" >> "$GITHUB_OUTPUT"

      # The pre-release of this run (#129): the Test packages get its version
      # suffix (-exp.<run>, -exp.<run>.pr<number>, -rc.<run>).
      - name: Channel
        id: channel
        # bash with pipefail: a failure of the command fails the step, not tee.
        shell: bash
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=(--event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --run "$GITHUB_RUN_NUMBER")
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            args+=(--pr "$PR_NUMBER" --labels "$LABELS")
          fi
          python3 tools/release_flow.py channel "${args[@]}" | tee -a "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-qt
        with:
          qt-version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Install (self-contained tree)
        run: cmake --install build --prefix "${{ github.workspace }}/stage"

      # The update check (#117) uses HTTPS. Qt's OpenSSL backend must be in
      # the tree; it loads the libssl.so.3 of the system at run time.
      - name: The deployed tree has the TLS backend
        run: |
          ls stage/plugins/tls || true
          test -f stage/plugins/tls/libqopensslbackend.so || {
            echo "::error::plugins/tls/libqopensslbackend.so is not in the deployed tree: the update check cannot use HTTPS"; exit 1; }

      - name: Package (portable tar.gz)
        working-directory: build
        run: cpack -B "${{ github.workspace }}/dist"

      - name: Package (AppImage)
        run: bash packaging/linux/make-appimage.sh stage "${{ steps.version.outputs.version }}" dist

      - name: Package (.deb)
        run: bash packaging/linux/make-deb.sh stage "${{ steps.version.outputs.version }}" dist

      # Runs the real xcb platform plugin under Xvfb — the same path a user on a
      # desktop gets, not the offscreen shortcut — and runs the AppImage rather
      # than the build tree, so a library the bundler forgot is caught here.
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # GitHub runners have no FUSE
          # Same reasoning as the Windows smoke test: blank out the builder's own
          # Qt so the AppImage can only use what it carries.
          QT_PLUGIN_PATH: ""
          QML2_IMPORT_PATH: ""
          QML_IMPORT_PATH: ""
          LD_LIBRARY_PATH: ""
        run: |
          appimage=$(ls dist/*.AppImage)
          echo "Running $appimage"
          set +e
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            timeout --signal=TERM 20 "$appimage"
          rc=$?
          set -e
          # 124/143 = still running when the timeout fired, which is the pass.
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then
            echo "::error::AppImage exited early with code $rc — the bundle is incomplete"
            exit 1
          fi
          echo "OK — AppImage stayed up for 20s under Xvfb"

      # Not on the runner: the setup-qt action installed every X11 and GL
      # library there, so a missing Depends entry would not show. A clean
      # ubuntu:24.04 container gets only the package and its Depends.
      - name: Test the .deb in a clean ubuntu:24.04 container
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb --field "$deb" Depends
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 \
            bash /src/packaging/linux/test-deb.sh "/src/$deb"

      # The Test app (#130): the same build directory, with the Test identity
      # (CMakeLists.txt § App identity). Only an AppImage: the .deb and the
      # .tar.gz are for the prod app.
      - name: Build the Test app (AppImage)
        run: |
          cmake -B build -DFD_APP_IDENTITY=test -DFD_VERSION_SUFFIX="${{ steps.channel.outputs.suffix }}"
          cmake --build build --parallel
          cmake --install build --prefix "${{ github.workspace }}/stage-test"
          bash packaging/linux/make-appimage.sh stage-test "${{ steps.channel.outputs.version }}" dist-test

      # As the prod smoke test, and the Test app keeps its data in its own
      # folder: DataAnalysis/FinanceDashboardTest, never DataAnalysis/FinanceDashboard.
      - name: Smoke test the Test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_PLUGIN_PATH: ""
          QML2_IMPORT_PATH: ""
          QML_IMPORT_PATH: ""
          LD_LIBRARY_PATH: ""
        run: |
          appimage=$(ls dist-test/FinanceDashboardTest-*.AppImage)
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data-test"
          echo "Running $appimage"
          set +e
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            timeout --signal=TERM 20 "$appimage"
          rc=$?
          set -e
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then
            echo "::error::The Test AppImage exited early with code $rc"
            exit 1
          fi
          test -f "$XDG_DATA_HOME/DataAnalysis/FinanceDashboardTest/finance_dashboard.db" || {
            echo "::error::The Test app did not create its database in DataAnalysis/FinanceDashboardTest"; exit 1; }
          if [ -e "$XDG_DATA_HOME/DataAnalysis/FinanceDashboard" ]; then
            echo "::error::The Test app wrote to the data folder of the prod app"; exit 1
          fi
          echo "OK — the Test AppImage stayed up for 20s, with its own data folder"

      - name: List artifacts
        run: ls -la dist/ dist-test/

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      # Not "packages-*": see the Windows job.
      - uses: actions/upload-artifact@v4
        with:
          name: test-packages-linux
          path: dist-test/*.AppImage
          if-no-files-found: error
          retention-days: 30

  source-archive:
    name: Package — source
    runs-on: ubuntu-24.04
    steps:
      # Full history so `git archive` sees a real tree, and so the archive
      # matches what a `git clone` at this commit would give.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(python3 tools/version.py current)" >> "$GITHUB_OUTPUT"

      # git archive, not `tar` over the working tree: it respects .gitignore and
      # .gitattributes by construction, so no build directory, no logs/ and no
      # IDE state can ever leak into a published source archive.
      - name: Create source archives
        run: |
          version="${{ steps.version.outputs.version }}"
          prefix="FinanceDashboard-${version}/"
          mkdir -p dist
          git archive --format=tar.gz -9 --prefix="$prefix" \
            -o "dist/FinanceDashboard-${version}-source.tar.gz" HEAD
          git archive --format=zip -9 --prefix="$prefix" \
            -o "dist/FinanceDashboard-${version}-source.zip" HEAD
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: packages-source
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  #  Open the next version on develop — on pushes to release/** only
  # ────────────────────────────────────────────────────────────────────────────
  # After release/X.Y.Z is cut from develop, a pull request into develop opens
  # the next version, so that develop can take changes again while the release
  # branch is tested. vX.Y.Z stays undated on develop until its release. CI
  # never pushes to develop: the maintainer merges the pull request. Each part
  # is skipped when it is already done, so each push to the release branch can
  # run the job again.
  open-next-version:
    name: Open the next version on develop
    needs: [changelog]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # push the branch
      pull-requests: write   # open the pull request into develop
      actions: write         # start CI on the branch (workflow_dispatch)
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the token so the branch can be pushed.
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Open the pull request into develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#release/}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin develop
          next=$(python tools/release_flow.py open-next "$version" --develop FETCH_HEAD)
          if [ -z "$next" ]; then
            echo "develop already opened the version after v${version}."
            echo "### Next version" >> "$GITHUB_STEP_SUMMARY"
            echo "develop already opened the version after \`v${version}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="chore/open-v${next}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch exists: an earlier run pushed it."
          else
            git push origin "$branch"
          fi

          created=false
          if [ -z "$(gh pr list --head "$branch" --base develop --state open --json number --jq '.[].number')" ]; then
            if ! gh pr create --base develop --head "$branch" \
                --title "chore(release): open v${next} on develop" \
                --body "\`release/${version}\` is cut. This pull request opens v${next} on \`develop\` as the in-progress version. Merge it before any other pull request into \`develop\`: their changelog entries then go under v${next}. v${version} stays undated on \`develop\` (\"release in progress\") until its release: the back-merge from \`main\` gives it its date. Opened by CI. See CI-CD.md § The release flow."; then
              echo "::error::Could not open the pull request from ${branch} into develop. Allow GitHub Actions to create pull requests (Settings → Actions → General → Workflow permissions), then re-run this job."
              exit 1
            fi
            created=true
          fi
          # A pull request opened with GITHUB_TOKEN starts no CI run (see the
          # back-merge in the release job): start one. Also when an earlier
          # run opened the pull request but stopped before this.
          if [ "$created" = true ] || [ "$(gh run list --branch "$branch" --workflow ci.yml --limit 1 --json databaseId --jq length)" = 0 ]; then
            gh workflow run ci.yml --ref "$branch"
          fi
          {
            echo "### Next version"
            echo "Pull request into develop: opens \`v${next}\`. Merge it before any other pull request into develop."
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  #  Release — needs every blocking job, and only on main
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Release
    # Every blocking job: a red Tests or Changelog job stops the release too.
    needs: [changelog, tests, package-windows, package-linux, source-archive]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Releases publish one at a time, first in, first out. `queue: max` keeps
    # every waiting release job; with the default queue, a third one would
    # cancel the one that waits.
    concurrency:
      group: release
      queue: max
    permissions:
      contents: write        # create the tag and the release, push the back-merge branch
      pull-requests: write   # open the back-merge pull request into develop
      actions: write         # start CI on the back-merge branch (workflow_dispatch)
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the token so the back-merge branch can be pushed.
          persist-credentials: true
          # The full history: the back-merge step checks whether develop
          # already contains this commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          version=$(python tools/version.py current)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # main only receives release/* and hotfix/* merges, and those branches
      # stamp the date with `version.py release`. An undated version here means
      # that something else was merged into main.
      - name: The version is dated
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("version.json", encoding="utf-8"))
          release = next(r for r in data["releases"] if r["version"] == data["current"])
          if not release.get("date"):
              print(f"::error::v{data['current']} has no date. main only receives merges of "
                    f"release/* and hotfix/* branches, which run `python tools/version.py release` "
                    f"first. See CI-CD.md § The release flow.")
              sys.exit(1)
          print(f"v{data['current']} — {release['date']}")
          PY

      # A re-run finishes what an earlier run started. A published release is
      # not published again, but the back-merge below still runs. A draft (a
      # run that stopped while gh uploaded the packages) is deleted and
      # published again.
      - name: Find an existing release
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          published=false
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "true" ]; then
              echo "::warning::$tag is a draft from an earlier run. It is deleted and published again."
              gh release delete "$tag" --yes
            else
              echo "::notice::$tag is already published. Only the back-merge runs."
              published=true
            fi
          fi
          # gh release create uses an existing tag as it is: stop if the tag
          # is on another commit.
          tagged=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" \
                   | awk '/\^\{\}$/ {peeled = $1} !/\^\{\}$/ {plain = $1} END {print (peeled != "" ? peeled : plain)}')
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag is on $tagged, not on this commit ($GITHUB_SHA)."
            exit 1
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Download every package
        if: steps.guard.outputs.published == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Checksums
        if: steps.guard.outputs.published == 'false'
        working-directory: dist
        run: |
          # Written outside the directory first, so the sums file can never end
          # up listing (a partially written copy of) itself.
          find . -maxdepth 1 -type f -printf '%f\0' | sort -z \
            | xargs -0 sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      # The changelog for this version comes from version.json; the "how do I
      # install this" half is the same every time and lives in a file so it can
      # be edited without touching the workflow.
      - name: Build release notes
        if: steps.guard.outputs.published == 'false'
        run: |
          {
            python tools/version.py notes --version "${{ steps.version.outputs.version }}"
            echo
            cat .github/release-notes-footer.md
          } > release-notes.md
          cat release-notes.md

      # `gh release create --target` also creates the tag vX.Y.Z on this commit.
      - name: Publish the GitHub release
        id: publish
        if: steps.guard.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Finance Dashboard ${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            dist/*

      # The release candidates of this version (preprod pre-releases, #129)
      # are not needed any more: delete them with their tags. A re-run finds
      # nothing to delete.
      - name: Delete the release candidates of this version
        if: steps.guard.outputs.published == 'true' || steps.publish.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="v${{ steps.version.outputs.version }}-rc."
          if ! candidates=$(gh release list --limit 200 --json tagName,isPrerelease \
              --jq ".[] | select(.isPrerelease and (.tagName | startswith(\"$prefix\"))) | .tagName"); then
            echo "::warning::Could not list the releases: delete the ${prefix}* pre-releases by hand."
            exit 0
          fi
          for candidate in $candidates; do
            echo "Deleting $candidate"
            gh release delete "$candidate" --yes --cleanup-tag \
              || echo "::warning::Could not delete $candidate: delete it by hand."
          done

      # ── Back into develop ────────────────────────────────────────────────────
      # A branch from develop, with this commit merged into it, and a pull
      # request into develop: develop gets the dated release and keeps the
      # in-progress version that it opened when the release branch was cut.
      # The merge is made here, not on GitHub, because version.md (a generated
      # file) conflicts: release_flow.py renders it again from the merged
      # version.json. If develop did not open the next version, it opens the
      # next patch. Nothing is committed to main.
      #
      # Each part is skipped when it is already done, so a re-run can finish a
      # back-merge that failed. GitHub refuses the pull request when the
      # repository does not allow GitHub Actions to create pull requests
      # (Settings → Actions → General → Workflow permissions): the job then
      # fails, and a re-run after the setting is changed opens it.
      - name: Open the back-merge pull request into develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          branch="chore/back-merge-v${version}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin develop
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "develop already contains $GITHUB_SHA: the back-merge is done."
            echo "backmerge=done" >> "$GITHUB_ENV"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch exists: an earlier run pushed it."
            git fetch --no-tags origin "$branch"
            next=$(git show FETCH_HEAD:version.json | python -c 'import json, sys; print(json.load(sys.stdin)["current"])')
          else
            # Any conflict other than version.md stops the step: merge by hand
            # (CI-CD.md § The release flow, hotfixes), then re-run the job.
            next=$(python tools/release_flow.py back-merge "$version" --release "$GITHUB_SHA" --develop FETCH_HEAD)
            git push origin "$branch"
          fi
          echo "next=$next" >> "$GITHUB_ENV"

          if [ -z "$(gh pr list --head "$branch" --base develop --state open --json number --jq '.[].number')" ]; then
            if ! gh pr create --base develop --head "$branch" \
                --title "chore(release): merge v${version} back into develop" \
                --body "Merges \`main\` (release v${version}) back into \`develop\`. The branch starts from \`develop\` and has \`main\` merged into it, so this pull request has no conflict. In-progress version after the merge: v${next}. Opened by the release job. Merge it with a merge commit, not a squash. See CI-CD.md § The release flow."; then
              echo "::error::Could not open the pull request from ${branch} into develop. Allow GitHub Actions to create pull requests (Settings → Actions → General → Workflow permissions), then re-run this job. It does not publish the release again."
              exit 1
            fi
          fi

          # The release came before the pull request that opens the next
          # version was merged: the back-merge opened that version itself.
          stale=$(gh pr list --head "chore/open-v${next}" --base develop --state open --json number --jq '.[].number')
          if [ -n "$stale" ]; then
            gh pr close "$stale" --delete-branch \
              --comment "v${version} is released before this pull request was merged. The back-merge pull request from ${branch} opens v${next} instead."
          fi

          # A pull request opened with GITHUB_TOKEN starts no CI run, so a
          # branch rule that asks for green CI would block it. workflow_dispatch
          # is an event that GITHUB_TOKEN can start: run CI on the branch, and
          # its checks show on the pull request.
          gh workflow run ci.yml --ref "$branch"
          echo "backmerge=opened" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          tag="${{ steps.version.outputs.tag }}"
          {
            echo "### Release"
            if [ "${{ steps.guard.outputs.published }}" = "true" ]; then
              echo "\`$tag\` was already published: not published again."
            elif [ "${{ steps.publish.outcome }}" = "success" ]; then
              echo "Published **$tag**: https://github.com/${{ github.repository }}/releases/tag/$tag"
            else
              echo "**$tag is not published.** See the failed step, then re-run this job."
            fi
            echo ""
            case "${backmerge:-}" in
              opened) echo "Back-merge into develop: pull request open, next version \`v${next}\`. CI runs on its branch." ;;
              done)   echo "Back-merge into develop: already done." ;;
              *)      echo "**Back-merge into develop: not done.** See the failed step, then re-run this job." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  #  Pre-releases of the Test app (#129) — see CI-CD.md § Release channels
  # ────────────────────────────────────────────────────────────────────────────
  # Experimental: each push to develop, and each run of a pull request with the
  # label "experimental" (not from a fork: its token cannot write). Preprod:
  # each push to release/*. The packages are the Test packages of the run
  # (test-packages-*), built with the version suffix of the channel.
  prerelease:
    name: Pre-release
    needs: [changelog, tests, package-windows, package-linux]
    if: >-
      (github.event_name == 'push'
        && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')))
      || (github.event_name == 'pull_request'
        && contains(github.event.pull_request.labels.*.name, 'experimental')
        && github.event.pull_request.head.repo.full_name == github.repository
        && (github.event.action != 'labeled' || github.event.label.name == 'experimental'))
    runs-on: ubuntu-24.04
    concurrency:
      group: prerelease-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write   # create the tag and the pre-release, delete the old ones
    env:
      # The commit of the tag: the commit of the run, or for a pull request
      # its head commit (CI built the merge of that commit into the base
      # branch; the notes say so).
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      # The same command as the packaging jobs: the same version and tag.
      - name: Channel
        id: channel
        # bash with pipefail: a failure of the command fails the step, not tee.
        shell: bash
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=(--event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --run "$GITHUB_RUN_NUMBER")
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            args+=(--pr "$PR_NUMBER" --labels "$LABELS")
          fi
          python3 tools/release_flow.py channel "${args[@]}" | tee -a "$GITHUB_OUTPUT"

      # As in the release job: a re-run does not publish twice, a draft is
      # published again, and a tag on another commit stops the job.
      - name: Find an existing pre-release
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.channel.outputs.publish }}" != "true" ]; then
            echo "::error::This run publishes no pre-release (channel: ${{ steps.channel.outputs.channel }})."
            exit 1
          fi
          tag="${{ steps.channel.outputs.tag }}"
          published=false
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "true" ]; then
              echo "::warning::$tag is a draft from an earlier run. It is deleted and published again."
              gh release delete "$tag" --yes
            else
              echo "::notice::$tag is already published."
              published=true
            fi
          fi
          tagged=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" \
                   | awk '/\^\{\}$/ {peeled = $1} !/\^\{\}$/ {plain = $1} END {print (peeled != "" ? peeled : plain)}')
          if [ -n "$tagged" ] && [ "$tagged" != "$TARGET_SHA" ]; then
            echo "::error::Tag $tag is on $tagged, not on the commit of this run ($TARGET_SHA). Delete the tag, then re-run this job."
            exit 1
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Download the Test packages
        if: steps.guard.outputs.published == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: test-packages-*
          merge-multiple: true
          path: dist

      # The packaging jobs computed the same version: check it in the file names.
      - name: The packages have the version of the pre-release
        if: steps.guard.outputs.published == 'false'
        run: |
          version="${{ steps.channel.outputs.version }}"
          ls -la dist
          for file in dist/*; do
            case "$(basename "$file")" in
              *"-${version}-"*) ;;
              *) echo "::error::$(basename "$file") does not have the version $version"; exit 1 ;;
            esac
          done

      - name: Checksums
        if: steps.guard.outputs.published == 'false'
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f -printf '%f\0' | sort -z \
            | xargs -0 sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      # Preprod: the changelog of the version in progress. Experimental: the
      # branch, the commit and the pull request. The text of the pull request
      # comes through env, never into the script itself.
      - name: Build release notes
        if: steps.guard.outputs.published == 'false'
        shell: bash
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          base=$(python3 tools/version.py current)
          {
            if [ "$CHANNEL" = "preprod" ]; then
              echo "**Preprod build** of v${base}: a release candidate of the Test app."
              echo
              python3 tools/version.py notes --version "$base"
            elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "**Experimental build** of the Test app, from a pull request."
              echo
              echo "- Pull request: #${PR_NUMBER} — ${PR_TITLE}"
              echo "- Branch: \`${GITHUB_HEAD_REF}\`, commit ${TARGET_SHA:0:12} (the tag), merged into \`${GITHUB_BASE_REF}\` for this build"
            else
              echo "**Experimental build** of the Test app, from \`${GITHUB_REF_NAME}\`."
              echo
              echo "- Commit ${GITHUB_SHA:0:12}: $(git log -1 --format=%s "$GITHUB_SHA")"
            fi
            echo
            cat .github/prerelease-notes-footer.md
          } > release-notes.md
          cat release-notes.md

      - name: Publish the pre-release
        id: publish
        if: steps.guard.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.channel.outputs.tag }}" \
            --prerelease \
            --title "Finance Dashboard Test ${{ steps.channel.outputs.tag }}" \
            --notes-file release-notes.md \
            --target "$TARGET_SHA" \
            dist/*

      # Keep the 10 newest published experimental pre-releases; delete the
      # older ones with their tags. A draft (a publication that a cancelled run
      # stopped) does not count. Another run can delete the same one at the
      # same time: a failure is only a warning.
      - name: Delete old experimental pre-releases
        if: steps.channel.outputs.channel == 'experimental'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! old=$(gh release list --limit 200 --json tagName,isPrerelease,isDraft,createdAt \
              --jq '[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | test("-exp\\.")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName'); then
            echo "::warning::Could not list the releases: no old pre-release is deleted."
            exit 0
          fi
          for tag in $old; do
            echo "Deleting $tag"
            gh release delete "$tag" --yes --cleanup-tag || echo "::warning::Could not delete $tag."
          done

      - name: Summary
        if: always()
        run: |
          tag="${{ steps.channel.outputs.tag }}"
          {
            echo "### Pre-release (${{ steps.channel.outputs.channel }})"
            if [ "${{ steps.guard.outputs.published }}" = "true" ]; then
              echo "\`$tag\` was already published: not published again."
            elif [ "${{ steps.publish.outcome }}" = "success" ]; then
              echo "Published **$tag**: https://github.com/${{ github.repository }}/releases/tag/$tag"
            else
              echo "**$tag is not published.** See the failed step, then re-run this job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
